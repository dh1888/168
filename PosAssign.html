        /* ---------------- Swatch popover toggle ---------------- */
        function closeSwatchRows() {
            document.querySelectorAll('.swatch-row.open').forEach(r => r.classList.remove('open'));
            document.querySelectorAll('.swatch-toggle-btn.active').forEach(b => b.classList.remove('active'));
        }
        function toggleSwatchRow(e, rowId) {
            e.stopPropagation();
            const row = document.getElementById(rowId);
            if (!row) return;
            const willOpen = !row.classList.contains('open');
            closeSwatchRows();
            if (willOpen) {
                row.classList.add('open');
                const btn = e.currentTarget;
                if (btn) btn.classList.add('active');
            }
        }
        document.addEventListener('click', function (e) {
            if (e.target.closest('.swatch-row') || e.target.closest('.swatch-toggle-btn')) return;
            closeSwatchRows();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSwatchRows();
        });

        /* ---------------- Context menu ---------------- */
        const ctxMenuEl = document.getElementById('ctxMenu');
        function showContextMenu(x, y, items) {
            ctxMenuEl.innerHTML = '';
            items.forEach(it => {
                if (it.sep) { const d = document.createElement('div'); d.className = 'ctx-sep'; ctxMenuEl.appendChild(d); return; }
                const d = document.createElement('div');
                d.className = 'ctx-item' + (it.disabled ? ' disabled' : '');
                d.textContent = it.label;
                if (!it.disabled) d.onclick = () => { hideContextMenu(); it.action(); };
                ctxMenuEl.appendChild(d);
            });
            ctxMenuEl.style.display = 'block';
            const menuW = ctxMenuEl.offsetWidth, menuH = ctxMenuEl.offsetHeight;
            const vw = window.innerWidth, vh = window.innerHeight;
            ctxMenuEl.style.left = Math.min(x, vw - menuW - 8) + 'px';
            ctxMenuEl.style.top = Math.min(y, vh - menuH - 8) + 'px';
        }
        function hideContextMenu() { ctxMenuEl.style.display = 'none'; }
        document.addEventListener('click', hideContextMenu);
        document.addEventListener('click', function (e) {
            const inCell = e.target.closest('td[data-r]');
            const inNotice = e.target.closest('.notice-line');
            const inDialog = e.target.closest('dialog');
            const inMenu = e.target.closest('#ctxMenu');
            const inToolbar = e.target.closest('#toolbar');
            if (inCell || inNotice || inDialog || inMenu || inToolbar) return;
            clearAllSelections();
        });
        document.addEventListener('scroll', hideContextMenu, true);
        window.addEventListener('resize', hideContextMenu);
        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            hideContextMenu();
            Object.values(grids).forEach(g => {
                if (g.cellSelection) {
                    g.cellSelection = null;
                    g.anchor = null;
                    g.onSelectionChange(g);
                    g.render();
                }
            });
            if (notice.selected.size) {
                notice.selected.clear();
                notice.render();
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key !== 'Delete') return;
            const active = document.activeElement;
            if (active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
            if (!window.activeTarget || window.activeTarget.type !== 'grid') return;
            const g = grids[window.activeTarget.id];
            if (!g || !g.cellSelection) return;
            e.preventDefault();
            g.clearContentSelection();
        });

        /* ---------------- Type-to-edit: selecting a single cell/line and typing starts editing directly ---------------- */
        document.addEventListener('keydown', e => {
            if (e.isComposing) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const active = document.activeElement;
            if (active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
            if (batchDialog.open || appModal.open) return;
            if (!window.activeTarget) return;

            const isPrintable = e.key.length === 1;
            const isEnterOrF2 = e.key === 'Enter' || e.key === 'F2';
            if (!isPrintable && !isEnterOrF2) return;

            if (window.activeTarget.type === 'grid') {
                const g = grids[window.activeTarget.id];
                if (!g || !g.cellSelection) return;
                const { r1, c1, r2, c2 } = g.cellSelection;
                if (r1 !== r2 || c1 !== c2) return;
                if (g.editingKey === r1 + ',' + c1) return;
                e.preventDefault();
                if (isPrintable) g.editCell(r1, c1, e.key);
                g.startEdit(r1, c1);
            } else if (window.activeTarget.type === 'notice') {
                if (notice.selected.size !== 1) return;
                const idx = Array.from(notice.selected)[0];
                if (notice.editingIdx === idx) return;
                e.preventDefault();
                if (isPrintable) notice.lines[idx] = e.key;
                notice.editingIdx = idx;
                notice.render();
            }
        });

        function buildGridMenu(gridId, mode, r, c) {
            const g = grids[gridId];
            const items = [];
            if (mode === 'cell') {
                items.push({ label: '✏ 双击此格编辑', disabled: true });
                items.push({ sep: true });
                items.push({ label: '⬆ 在上方插入行', action: () => g.insertRowAt(r) });
                items.push({ label: '⬇ 在下方插入行', action: () => g.insertRowAt(r + 1) });
                items.push({ label: '🗑 删除本行', action: () => g.deleteRow(r) });
                items.push({ sep: true });
                items.push({ label: '⬅ 在左侧插入列', action: () => g.insertColumnAt(c) });
                items.push({ label: '➡ 在右侧插入列', action: () => g.insertColumnAt(c + 1) });
                items.push({ label: '🗑 删除本列', action: () => g.deleteColumn(c) });
                items.push({ sep: true });
                const sel = g.cellSelection;
                const canMerge = sel && !(sel.r1 === sel.r2 && sel.c1 === sel.c2);
                items.push({ label: '⛓ 合并选中单元格', disabled: !canMerge, action: () => g.mergeSelected() });
                const cellObj = g.origins.get(r + ',' + c);
                const canUnmerge = cellObj && (cellObj.rowSpan > 1 || cellObj.colSpan > 1);
                items.push({ label: '✂ 取消合并本单元格', disabled: !canUnmerge, action: () => g.unmergeCell(r, c) });
                items.push({ sep: true });
                items.push({ label: canMerge ? '🧹 删除选中内容' : '🧹 删除内容', action: () => clearCellOrSelectionContent(gridId, r, c) });
                items.push({ sep: true });
                items.push({ label: '📄 复制 (Ctrl+C)', action: () => copyGridSelection(g) });
                items.push({ label: '📥 粘贴 (Ctrl+V)', action: () => pasteGridSelection(g) });
                items.push({ sep: true });
            }
            items.push({ label: '＋ 新增行（末尾）', action: () => g.addRow() });
            items.push({ label: '＋ 新增列（末尾）', action: () => g.addColumn() });
            items.push({ label: '📋 批量新增行…', action: () => openBatchFor(gridId) });
            items.push({ sep: true });
            items.push({ label: '👤 新增员工岗位…', action: () => quickAddEmployee(gridId) });
            items.push({ sep: true });
            items.push({ label: '🗑 删除整个模块…', action: () => deleteModule(gridId) });
            return items;
        }

        function buildNoticeMenu(idx) {
            const items = [];
            if (idx !== null) {
                items.push({ label: '✏ 双击此行编辑', disabled: true });
                items.push({ sep: true });
                items.push({ label: '⬆ 在上方插入一行', action: () => notice.insertLineAt(idx, '') });
                items.push({ label: '⬇ 在下方插入一行', action: () => notice.insertLineAt(idx + 1, '') });
                items.push({ label: '🗑 删除本行', action: () => notice.deleteLine(idx) });
                items.push({ sep: true });
            }
            items.push({ label: '＋ 新增一行（末尾）', action: () => notice.addLine() });
            items.push({ label: '📋 批量新增…', action: () => notice.openBatch() });
            items.push({ label: `🗑 删除选中行（${notice.selected.size}）`, disabled: notice.selected.size === 0, action: () => notice.deleteSelected() });
            return items;
        }

        document.addEventListener('contextmenu', function (e) {
            const noticeSection = e.target.closest('#noticeBoard');
            if (noticeSection) {
                e.preventDefault();
                const line = e.target.closest('.notice-line');
                const idx = line ? Number(line.dataset.idx) : null;
                showContextMenu(e.pageX, e.pageY, buildNoticeMenu(idx));
                return;
            }
            const table = e.target.closest('table[data-grid]');
            const board = e.target.closest('.board');
            if (table) {
                e.preventDefault();
                const gridId = table.dataset.grid;
                const td = e.target.closest('td[data-r]');
                let mode = 'general', r = null, c = null;
                if (td) { mode = 'cell'; r = Number(td.dataset.r); c = Number(td.dataset.c); }
                showContextMenu(e.pageX, e.pageY, buildGridMenu(gridId, mode, r, c));
                return;
            }
            if (board) {
                e.preventDefault();
                showContextMenu(e.pageX, e.pageY, buildGridMenu(board.dataset.gridId, 'general', null, null));
                return;
            }
        });

        /* ---------------- Persistence (localStorage) ---------------- */
        const STORAGE_KEY = 'schedule_editor_state_v1';
        var persistTimer = null;
        function schedulePersist() {
            if (persistTimer) clearTimeout(persistTimer);
            persistTimer = setTimeout(persistAll, 150);
        }
        function serializeGrid(g) {
            return {
                rows: g.rows, cols: g.cols, headerRows: g.headerRows,
                rowStyle: g.rowStyle,
                cells: Array.from(g.origins.entries()).map(([key, cell]) => {
                    const [r, c] = key.split(',').map(Number);
                    return { r, c, v: cell.value, rs: cell.rowSpan, cs: cell.colSpan, style: cell.style || {} };
                })
            };
        }
        function buildStateObject() {
            const state = { grids: {}, notice: notice.lines, noticeStyles: notice.styles, boardMeta: {}, boardOrder: boardOrder.slice() };
            Object.keys(grids).forEach(id => { state.grids[id] = serializeGrid(grids[id]); });
            Object.keys(boardMeta).forEach(id => { state.boardMeta[id] = Object.assign({}, boardMeta[id]); });
            return state;
        }
        function ensureBoardsFromSaved(saved) {
            if (!saved || !saved.grids) return;
            const order = Array.isArray(saved.boardOrder) ? saved.boardOrder : Object.keys(saved.grids);
            order.forEach(id => {
                if (grids[id] || !saved.grids[id]) return;
                const meta = (saved.boardMeta && saved.boardMeta[id]) || {};
                const theme = meta.theme === 'blue' ? 'blue' : 'teal';
                buildBoard(id, theme, meta.title || id, meta.code || '', [['出款', '', '', '']], '');
            });
        }
        function applyBoardMetaToDom(id) {
            const wrap = document.querySelector(`[data-grid-id="${id}"]`);
            if (!wrap) return;
            const meta = boardMeta[id];
            if (!meta) return;
            const titleEl = wrap.querySelector('.title-text');
            const codeEl = wrap.querySelector('.title .code');
            if (titleEl && titleEl.getAttribute('contenteditable') !== 'true') titleEl.innerText = meta.title || '';
            if (codeEl && codeEl.getAttribute('contenteditable') !== 'true') codeEl.innerText = meta.code || '';
        }
        function restoreBoardMeta(saved) {
            if (!saved) return;
            Object.keys(saved).forEach(id => {
                boardMeta[id] = Object.assign({}, boardMeta[id], saved[id]);
                applyBoardMetaToDom(id);
            });
        }
        function persistAll() {
            try {
                const json = JSON.stringify(buildStateObject());
                localStorage.setItem(STORAGE_KEY, json);
                pushUndoSnapshot(json);
            } catch (e) { /* 存储不可用时静默忽略 */ }
        }
        function loadPersisted() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function restoreGridFromSaved(g, saved) {
            g.rows = saved.rows;
            g.cols = saved.cols;
            g.headerRows = saved.headerRows;
            g.rowStyle = saved.rowStyle || {};
            g.origins = new Map();
            (saved.cells || []).forEach(c => {
                g.origins.set(c.r + ',' + c.c, { value: c.v || '', rowSpan: c.rs || 1, colSpan: c.cs || 1, style: c.style || {} });
            });
            g._fillDefaults();
            g.clearSelections();
            g.render();
        }
        function restoreAll() {
            const saved = loadPersisted();
            if (!saved) return;
            ensureBoardsFromSaved(saved);
            Object.keys(grids).forEach(id => {
                if (saved.grids && saved.grids[id]) restoreGridFromSaved(grids[id], saved.grids[id]);
            });
            if (Array.isArray(saved.notice)) {
                notice.lines = saved.notice;
                notice.styles = Array.isArray(saved.noticeStyles) && saved.noticeStyles.length === saved.notice.length
                    ? saved.noticeStyles
                    : notice.lines.map(() => ({}));
                notice.selected.clear();
                notice.render();
            }
            restoreBoardMeta(saved.boardMeta);
        }

        /* ---------------- Init boards from the source image ---------------- */
        buildBoard('boardOld', 'teal', '老站', '25S-05X-D16-A02-N06-BR8',
            [
                ['出款', '', '', ''],
                ['出款', '', '', ''],
                ['出款', '', '', ''],
            ], '');

        buildBoard('boardNew', 'blue', '新站', 'i05-73B-666BR-X06-NA5-Win168',
            [
                ['出款', '', '', ''],
                ['出款', '', '', ''],
                ['出款', '', '', ''],
            ], '');

        /* ---------------- Undo (Ctrl+Z) ---------------- */
        const undoStack = [];
        const UNDO_LIMIT = 100;
        function updateUndoButtonState() {
            const btn = document.getElementById('undoBtn');
            if (btn) btn.disabled = undoStack.length <= 1;
        }
        function pushUndoSnapshot(json) {
            if (window.__restoringUndo) return;
            const top = undoStack[undoStack.length - 1];
            if (top === json) return;
            undoStack.push(json);
            if (undoStack.length > UNDO_LIMIT) undoStack.shift();
            updateUndoButtonState();
        }
        function removeBoard(id) {
            const wrap = document.querySelector(`[data-grid-id="${id}"]`);
            if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
            delete grids[id];
            delete boardMeta[id];
            const idx = boardOrder.indexOf(id);
            if (idx !== -1) boardOrder.splice(idx, 1);
        }
        async function deleteModule(gridId) {
            if (!grids[gridId]) return;
            const title = (boardMeta[gridId] && boardMeta[gridId].title) || gridId;
            const ok = await showConfirm(`确定要删除模块"${title}"吗？`, { title: '删除模块', okText: '删除', danger: true });
            if (!ok) return;
            removeBoard(gridId);
            if (window.activeTarget && window.activeTarget.type === 'grid' && window.activeTarget.id === gridId) {
                const firstId = Object.keys(grids)[0];
                setActiveTarget(firstId ? { type: 'grid', id: firstId } : null);
            }
            if (typeof schedulePersist === 'function') schedulePersist();
        }
        function deleteActiveModule() {
            if (!window.activeTarget || window.activeTarget.type !== 'grid') { showAlert('请先点击选中要删除的模块（表格）'); return; }
            deleteModule(window.activeTarget.id);
        }
        function applyFullState(state) {
            window.__restoringUndo = true;
            ensureBoardsFromSaved(state);
            Object.keys(grids).forEach(id => {
                if (!(state.grids && state.grids[id])) { removeBoard(id); return; }
                restoreGridFromSaved(grids[id], state.grids[id]);
            });
            if (Array.isArray(state.notice)) {
                notice.lines = state.notice;
                notice.styles = Array.isArray(state.noticeStyles) && state.noticeStyles.length === state.notice.length
                    ? state.noticeStyles
                    : state.notice.map(() => ({}));
                notice.selected.clear();
                notice.editingIdx = null;
                notice.render();
            }
            restoreBoardMeta(state.boardMeta);
            if (window.activeTarget && window.activeTarget.type === 'grid' && !grids[window.activeTarget.id]) {
                const firstId = Object.keys(grids)[0];
                setActiveTarget(firstId ? { type: 'grid', id: firstId } : null);
            }
            window.__restoringUndo = false;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStateObject())); } catch (e) { /* 忽略 */ }
            updateUndoButtonState();
        }
        function undo() {
            if (undoStack.length <= 1) return;
            undoStack.pop();
            const prevJson = undoStack[undoStack.length - 1];
            hideContextMenu();
            applyFullState(JSON.parse(prevJson));
        }
        document.addEventListener('keydown', function (e) {
            const key = e.key ? e.key.toLowerCase() : '';
            if ((e.ctrlKey || e.metaKey) && key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            }
        });

        /* ---------------- Copy as vertical image ---------------- */
        const IMG_COLOR_PROPS = ['backgroundColor', 'backgroundImage', 'color', 'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor', 'boxShadow'];
        function inlineComputedStyles(srcRoot, cloneRoot) {
            const srcEls = [srcRoot, ...srcRoot.querySelectorAll('*')];
            const cloneEls = [cloneRoot, ...cloneRoot.querySelectorAll('*')];
            for (let i = 0; i < srcEls.length && i < cloneEls.length; i++) {
                const cs = window.getComputedStyle(srcEls[i]);
                IMG_COLOR_PROPS.forEach(p => {
                    try { cloneEls[i].style[p] = cs[p]; } catch (e) { /* 忽略不支持的属性 */ }
                });
            }
        }
        function cleanCloneForImage(root) {
            root.querySelectorAll('.edit-hint').forEach(el => el.remove());
            root.querySelectorAll('.status-pill').forEach(el => el.remove());
            root.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            root.querySelectorAll('.cellsel').forEach(el => el.classList.remove('cellsel'));
            root.querySelectorAll('.editing').forEach(el => el.classList.remove('editing'));
            root.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
            root.style.boxShadow = 'none';
            root.style.transform = 'none';
            root.style.animation = 'none';
        }
        async function copyAsImage() {
            const btn = document.getElementById('copyImageBtn');
            const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = '🖼 复制图片'; } };
            if (typeof html2canvas === 'undefined') { showAlert('图片生成组件加载失败，请检查网络后重试'); return; }
            if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:fixed;left:-99999px;top:0;width:760px;background:#f5f4ef;padding:28px;display:flex;flex-direction:column;gap:22px;font-family:inherit;';
            try {
                document.querySelectorAll('#boards .board').forEach(b => {
                    const clone = b.cloneNode(true);
                    inlineComputedStyles(b, clone);
                    cleanCloneForImage(clone);
                    clone.style.width = '100%';
                    clone.style.minWidth = '0';
                    clone.style.flex = 'none';
                    wrapper.appendChild(clone);
                });
                const noticeEl = document.getElementById('noticeBoard');
                if (noticeEl) {
                    const noticeClone = noticeEl.cloneNode(true);
                    inlineComputedStyles(noticeEl, noticeClone);
                    cleanCloneForImage(noticeClone);
                    noticeClone.style.marginTop = '0';
                    wrapper.appendChild(noticeClone);
                }
                document.body.appendChild(wrapper);
                const canvas = await html2canvas(wrapper, { backgroundColor: '#f5f4ef', scale: 2, useCORS: true });
                document.body.removeChild(wrapper);
                canvas.toBlob(async (blob) => {
                    if (!blob) { showAlert('生成图片失败，请重试'); resetBtn(); return; }
                    try {
                        if (navigator.clipboard && window.ClipboardItem) {
                            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                            if (btn) btn.textContent = '✅ 已复制到剪贴板';
                        } else {
                            throw new Error('clipboard-unavailable');
                        }
                    } catch (err) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = '排班表.png';
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        if (btn) btn.textContent = '⬇ 已下载图片';
                    }
                    setTimeout(resetBtn, 1800);
                }, 'image/png');
            } catch (e) {
                console.error(e);
                if (wrapper.parentNode) document.body.removeChild(wrapper);
                showAlert('生成图片失败，请重试');
                resetBtn();
            }
        }

        restoreAll();
        setActiveTarget({ type: 'grid', id: 'boardOld' });
        undoStack.push(JSON.stringify(buildStateObject()));
        updateUndoButtonState();
    </script>
</body>
