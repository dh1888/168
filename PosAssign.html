<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班表编辑器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --paper: #f5f4ef;
            --card: #ffffff;
            --ink: #1c2b28;
            --muted: #7a8a84;
            --line: #dfe4e0;

            --old-1: #0e7c6b;
            --old-1-dark: #0a5c4f;
            --old-1-light: #1a9c86;
            --old-2: #e6f5f1;
            --old-3: #c7ece1;

            --new-1: #33509e;
            --new-1-dark: #253b78;
            --new-1-light: #4a68b8;
            --new-2: #eaeffb;
            --new-3: #cdd9f5;

            --gold: #e3a53c;
            --gold-soft: #fbe7c2;
            --rose: #fbe3e6;
            --rose-line: #f3c3cb;
            --rose-text: #b83a52;
            --rose-light: #e2748f;

            --pink-strong: #e85d8a;
            --pink-grad: linear-gradient(135deg, #fde3ec, #f7b8cf);

            --shadow-sm: 0 1px 2px rgba(20, 40, 35, .06);
            --shadow-md: 0 6px 20px -6px rgba(20, 40, 35, .16);
            --shadow-lg: 0 16px 40px -12px rgba(20, 40, 35, .24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 4px 20px 10px;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(1200px 500px at 10% -10%, rgba(14, 124, 107, .06), transparent 60%),
                radial-gradient(1000px 500px at 100% 0%, rgba(51, 80, 158, .06), transparent 55%),
                var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }


        h1 {
            font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: .2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--old-1), var(--new-1));
            box-shadow: 0 0 0 4px rgba(14, 124, 107, .12);
        }

        .sub {
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.9;
            max-width: 720px;
        }

        .sub kbd {
            font-family: "Space Grotesk", monospace;
            background: #fff;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 5px;
            padding: 1px 6px;
            font-size: 11px;
            color: var(--ink);
        }

        .legend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .legend-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
            background: #fff;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            box-shadow: var(--shadow-sm);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .legend-chip:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .legend-chip i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        /* ---------------- Toolbar ---------------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 60;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: rgba(245, 244, 239, .94);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toolbar-sep {
            width: 1px;
            align-self: stretch;
            background: var(--line);
            margin: 2px 2px;
        }

        .tb-title {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            margin-right: 2px;
            white-space: nowrap;
        }

        .tb-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--old-1-dark);
            background: #fff;
            border: 1px solid var(--line);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .toolbar button {
            font-family: inherit;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }

        .toolbar button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
            background: var(--old-2);
        }

        .toolbar button:active {
            transform: translateY(0);
        }

        .toolbar button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .toolbar select {
            font-family: inherit;
            font-size: 12px;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
        }

        .tb-color {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .tb-color input[type=color] {
            width: 28px;
            height: 24px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0;
            cursor: pointer;
            background: none;
        }

        .swatch-toggle-wrap {
            position: relative;
            display: inline-flex;
        }

        .swatch-toggle-btn {
            font-family: inherit;
            font-size: 13px;
            padding: 5px 9px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
            transition: all .15s;
            line-height: 1;
        }

        .swatch-toggle-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
            background: var(--old-2);
        }

        .swatch-toggle-btn.active {
            background: var(--gold-soft);
            border-color: var(--gold);
        }

        .swatch-row {
            display: none;
            align-items: center;
            gap: 3px;
            padding: 5px 6px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 70;
            box-shadow: var(--shadow-lg);
            flex-wrap: wrap;
            width: 138px;
            animation: menuIn .12s ease;
        }

        .swatch-row.open {
            display: flex;
        }

        .swatch-btn {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(20, 30, 28, .18);
            padding: 0;
            cursor: pointer;
            transition: transform .1s ease, box-shadow .1s ease;
            flex: none;
        }

        .swatch-btn:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-sm);
            z-index: 1;
        }

        .swatch-btn:active {
            transform: scale(1.05);
        }

        .boards {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .board {
            flex: 1 1 500px;
            min-width: 440px;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--line);
            transition: box-shadow .25s ease, transform .25s ease;
            animation: riseIn .4s ease both;
        }

        .board:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .board-head {
            padding: 14px 16px 12px;
            background: linear-gradient(120deg, var(--old-1-light) 0%, var(--old-1) 50%, var(--old-1-dark) 100%);
            box-shadow: inset 0 -2px 0 rgba(227, 165, 60, .55);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .board.blue .board-head {
            background: linear-gradient(120deg, var(--new-1-light) 0%, var(--new-1) 50%, var(--new-1-dark) 100%);
        }

        .board-head .title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .board-head .title .code {
            font-family: "Space Grotesk", monospace;
            font-weight: 500;
            font-size: 11px;
            background: rgba(255, 255, 255, .18);
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: .5px;
        }

        .board-head .title-text,
        .board-head .title .code {
            outline: none;
            border-radius: 4px;
            cursor: default;
        }

        .board-head .title-text[contenteditable="true"],
        .board-head .title .code[contenteditable="true"] {
            cursor: text;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .6);
            background: rgba(255, 255, 255, .16);
            padding: 0 4px;
        }

        .status-pill {
            font-size: 11px;
            background: rgba(255, 255, 255, .15);
            padding: 4px 10px;
            border-radius: 999px;
            min-width: 90px;
            text-align: center;
            opacity: .85;
            transition: opacity .2s, background .2s;
        }

        .status-pill.active {
            opacity: 1;
            background: var(--pink-strong);
            color: #fff;
            font-weight: 600;
        }



        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        td,
        th {
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 10px 12px;
            font-size: 13px;
            vertical-align: middle;
            position: relative;
            outline: none;
            transition: background .12s ease;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }

        td.hdr {
            padding-top: 11px;
            padding-bottom: 11px;
        }

        td[contenteditable="false"] {
            cursor: pointer;
        }

        td[contenteditable="true"] {
            cursor: text;
        }

        tr:hover td.datarow-even,
        tr:hover td.datarow-odd {
            filter: brightness(0.98);
        }

        td.hdr {
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, var(--old-1) 0%, var(--old-1-dark) 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -2px 0 rgba(227, 165, 60, .4);
            letter-spacing: .3px;
        }

        .board.blue td.hdr {
            background: linear-gradient(180deg, var(--new-1) 0%, var(--new-1-dark) 100%);
        }

        td.datarow-even {
            background: var(--old-2);
        }

        .board.blue td.datarow-even {
            background: var(--new-2);
        }

        td.datarow-odd {
            background: #fff;
        }

        td.reviewrow {
            background: var(--gold-soft);
            font-weight: 500;
        }

        td.editing {
            box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 3px rgba(227, 165, 60, .18);
            background: #fffef8 !important;
            animation: pop .12s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.98);
            }

            to {
                transform: scale(1);
            }
        }

        td.cellsel {
            background: var(--pink-grad) !important;
            box-shadow: inset 0 0 0 1px var(--pink-strong);
            color: #000 !important;
        }

        .edit-hint {
            position: absolute;
            right: 4px;
            top: 4px;
            font-size: 9px;
            color: var(--muted);
            opacity: 0;
            transition: opacity .15s;
            pointer-events: none;
            background: #fff;
            border-radius: 3px;
            padding: 0 3px;
        }

        td[contenteditable="false"]:hover .edit-hint {
            opacity: .8;
        }

        .notice {
            margin-top: 24px;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--rose-line);
            box-shadow: var(--shadow-md);
            transition: box-shadow .25s ease;
        }

        .notice:hover {
            box-shadow: var(--shadow-lg);
        }

        .notice .board-head {
            background: linear-gradient(135deg, var(--rose-light) 0%, #d9647a 55%, var(--rose-text) 100%);
        }

        .notice-line {
            padding: 11px 18px 11px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--rose-line);
            border-left: 2px solid transparent;
            transition: background .15s, border-color .15s;
        }

        .notice-line:hover {
            background: var(--rose);
            border-left-color: var(--rose-text);
        }

        .notice-line:last-child {
            border-bottom: none;
        }

        .notice-line .txt {
            flex: 1;
            outline: none;
            font-size: 13px;
            line-height: 1.6;
            padding: 3px 6px;
            border-radius: 5px;
            cursor: pointer;
            white-space: pre-wrap;
        }

        .notice-line .txt[contenteditable="true"] {
            box-shadow: inset 0 0 0 2px var(--gold);
            background: #fffef8;
            cursor: text;
        }

        .notice-line.selected {
            background: var(--pink-grad);
            border-left-color: var(--pink-strong);
        }

        .notice-line.selected .txt {
            color: #000;
        }

        /* context menu */
        #ctxMenu {
            position: fixed;
            z-index: 9999;
            display: none;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 6px;
            min-width: 200px;
            font-size: 13px;
            max-height: 80vh;
            overflow: auto;
            animation: menuIn .12s ease;
        }

        @keyframes menuIn {
            from {
                opacity: 0;
                transform: translateY(-4px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .ctx-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .1s;
        }

        .ctx-item:hover {
            background: var(--old-2);
        }

        .ctx-item.disabled {
            color: #c3ccc8;
            cursor: default;
        }

        .ctx-item.disabled:hover {
            background: none;
        }

        .ctx-sep {
            height: 1px;
            background: var(--line);
            margin: 5px 6px;
        }

        dialog {
            border: none;
            border-radius: 14px;
            padding: 0;
            width: 440px;
            max-width: 90vw;
            box-shadow: var(--shadow-lg);
        }

        dialog .dhead {
            padding: 16px 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
        }

        dialog .dbody {
            padding: 16px 20px;
        }

        dialog textarea {
            width: 100%;
            height: 150px;
            font-family: "Space Grotesk", monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            resize: vertical;
        }

        dialog textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(227, 165, 60, .25);
            border-color: var(--gold);
        }

        dialog .hint {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.6;
        }

        dialog .dfoot {
            padding: 12px 20px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        dialog .dfoot button {
            padding: 7px 16px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            cursor: pointer;
            font-size: 12.5px;
            transition: all .15s;
            font-family: inherit;
        }

        dialog .dfoot button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        dialog .dfoot button.primary {
            background: var(--old-1);
            color: #fff;
            border-color: var(--old-1);
        }

        dialog .dfoot button.danger {
            background: var(--rose-text);
            color: #fff;
            border-color: var(--rose-text);
        }

        dialog .dbody .modal-msg {
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink);
        }

        dialog .dbody .field {
            margin-bottom: 14px;
        }

        dialog .dbody .field:last-child {
            margin-bottom: 0;
        }

        dialog .dbody .flabel {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }

        dialog .dbody input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            color: var(--ink);
            background: #fff;
        }

        dialog .dbody input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(227, 165, 60, .25);
            border-color: var(--gold);
        }

        ::backdrop {
            background: rgba(20, 30, 28, .35);
            backdrop-filter: blur(1px);
        }

        @media(max-width:900px) {
            .board {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <span class="tb-label" id="activeTargetLabel">未选择</span>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
            <button id="undoBtn" onclick="undo()" title="撤销 (Ctrl+Z)" disabled>↩ 撤销</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
            <button id="copyImageBtn" onclick="copyAsImage()" title="生成纵向长图并复制到剪贴板">🖼 复制图片</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
            <span class="tb-title">表格：</span>
            <button onclick="toolbarAction('addRowEnd')">+行(末尾)</button>
            <button onclick="toolbarAction('addColEnd')">+列(末尾)</button>
            <button onclick="toolbarAction('insertRowAbove')">↑插入行</button>
            <button onclick="toolbarAction('insertRowBelow')">↓插入行</button>
            <button onclick="toolbarAction('deleteRow')">🗑删除行</button>
            <button onclick="toolbarAction('insertColLeft')">←插入列</button>
            <button onclick="toolbarAction('insertColRight')">→插入列</button>
            <button onclick="toolbarAction('deleteCol')">🗑删除列</button>
            <button onclick="toolbarAction('merge')">⛓合并</button>
            <button onclick="toolbarAction('unmerge')">✂取消合并</button>
            <button onclick="toolbarAction('clearContent')">🧹删除内容</button>
            <button onclick="toolbarAction('batchAdd')">📋批量新增</button>
            <button onclick="toolbarAction('addEmployee')">👤新增员工</button>
            <button onclick="toolbarAction('copyCells')" title="复制选中单元格 (Ctrl+C)">📄复制</button>
            <button onclick="toolbarAction('pasteCells')" title="粘贴到选中单元格 (Ctrl+V)">📥粘贴</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
            <span class="tb-title">注意事项：</span>
            <button onclick="noticeToolbarAction('addEnd')">+新增行</button>
            <button onclick="noticeToolbarAction('insertAbove')">↑插入</button>
            <button onclick="noticeToolbarAction('insertBelow')">↓插入</button>
            <button onclick="noticeToolbarAction('deleteSelected')">🗑删除选中</button>
            <button onclick="noticeToolbarAction('batchAdd')">📋批量新增</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
            <span class="tb-title">格式：</span>
            <select id="fontSizeSelect" onchange="applyFontSize(this.value); this.value='';">
                <option value="">字号</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="16">16</option>
                <option value="18">18</option>
                <option value="20">20</option>
                <option value="24">24</option>
            </select>
            <label class="tb-color">字体<input type="color" id="fontColorInput" value="#1c2b28"
                    onchange="applyFontColor(this.value)"></label>
            <div class="swatch-toggle-wrap">
                <button type="button" class="swatch-toggle-btn" id="fontSwatchToggleBtn"
                    onclick="toggleSwatchRow(event,'fontSwatchRow')" title="字体颜色快选">🎨</button>
                <div class="swatch-row" id="fontSwatchRow" title="字体颜色快选"></div>
            </div>
            <label class="tb-color">背景<input type="color" id="bgColorInput" value="#ffffff"
                    onchange="applyBgColor(this.value)"></label>
            <div class="swatch-toggle-wrap">
                <button type="button" class="swatch-toggle-btn" id="bgSwatchToggleBtn"
                    onclick="toggleSwatchRow(event,'bgSwatchRow')" title="背景颜色快选">🎨</button>
                <div class="swatch-row" id="bgSwatchRow" title="背景颜色快选"></div>
            </div>
            <button onclick="clearFormat()">清除格式</button>
            <button onclick="addNewModule()">➕新增模块</button>
            <button onclick="deleteActiveModule()">🗑删除模块</button>
        </div>
    </div>

    <div class="boards" id="boards"></div>

    <div class="notice" id="noticeBoard">
        <div class="board-head">
            <div class="title">🚨 岗位注意事项</div>
            <div class="status-pill" id="noticeStatus">右键新增/删除</div>
        </div>
        <div id="noticeLines"></div>
    </div>

    <div id="ctxMenu"></div>

    <dialog id="batchDialog">
        <div class="dhead">批量新增</div>
        <div class="dbody">
            <textarea id="batchInput"
                placeholder="每行一条记录&#10;表格中：列之间用英文逗号 , 或制表符分隔，例如：出款,阿花,25S、D16,A02、X06&#10;注意事项：每行文字直接作为一条注意事项"></textarea>
            <div class="hint">每一行文本变成一条新记录；不足的列留空。</div>
        </div>
        <div class="dfoot">
            <button onclick="batchDialog.close()">取消</button>
            <button class="primary" id="batchConfirmBtn">确认新增</button>
        </div>
    </dialog>

    <dialog id="appModal">
        <div class="dhead" id="appModalTitle"></div>
        <div class="dbody" id="appModalBody"></div>
        <div class="dfoot" id="appModalFoot"></div>
    </dialog>

    <script>
        /* ---------------- style helper ---------------- */
        function styleToCss(style) {
            if (!style) return '';
            const parts = [];
            if (style.fontSize) parts.push('font-size:' + style.fontSize + 'px');
            if (style.color) parts.push('color:' + style.color);
            if (style.bg) parts.push('background:' + style.bg);
            return parts.length ? (' style="' + parts.join(';') + '"') : '';
        }

        /* ---------------- Table Grid Engine ---------------- */
        class TableGrid {
            constructor(id, opts) {
                this.id = id;
                this.container = document.getElementById(id);
                this.rows = opts.rows;
                this.cols = opts.cols;
                this.headerRows = opts.headerRows || 0;
                this.origins = new Map(); // "r,c" -> {value, rowSpan, colSpan, style}
                this.rowStyle = opts.rowStyle || {};
                this.cellSelection = null;
                this.anchor = null;
                this.editingKey = null;
                this.onSelectionChange = opts.onSelectionChange || (() => { });
                (opts.cells || []).forEach(c => {
                    this.origins.set(c.r + ',' + c.c, { value: c.v || '', rowSpan: c.rs || 1, colSpan: c.cs || 1, style: c.style || {} });
                });
                this._fillDefaults();
                this.render();
            }
            _coverage() {
                const covered = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
                for (const [key, cell] of this.origins) {
                    const [r, c] = key.split(',').map(Number);
                    for (let i = 0; i < cell.rowSpan; i++)
                        for (let j = 0; j < cell.colSpan; j++) {
                            if (i === 0 && j === 0) continue;
                            if (r + i < this.rows && c + j < this.cols) covered[r + i][c + j] = true;
                        }
                }
                return covered;
            }
            _fillDefaults() {
                const covered = this._coverage();
                for (let r = 0; r < this.rows; r++)
                    for (let c = 0; c < this.cols; c++) {
                        const key = r + ',' + c;
                        if (!covered[r][c] && !this.origins.has(key)) this.origins.set(key, { value: '', rowSpan: 1, colSpan: 1, style: {} });
                    }
            }
            addRow() { this.insertRowAt(this.rows); }
            addColumn() { this.insertColumnAt(this.cols); }
            addRowWithValues(values) { this.insertRowAt(this.rows, values); }
            _shiftRowStyleForInsert(rowStyle, rIndex) {
                const next = {};
                Object.keys(rowStyle || {}).forEach(k => {
                    const r = Number(k);
                    next[r >= rIndex ? r + 1 : r] = rowStyle[k];
                });
                return next;
            }
            _shiftRowStyleForRemove(rowStyle, rIndex) {
                const next = {};
                Object.keys(rowStyle || {}).forEach(k => {
                    const r = Number(k);
                    if (r === rIndex) return;
                    next[r > rIndex ? r - 1 : r] = rowStyle[k];
                });
                return next;
            }
            insertRowAt(rIndex, values) {
                const newOrigins = new Map();
                for (const [key, cell] of this.origins) {
                    let [r, c] = key.split(',').map(Number);
                    if (r < rIndex) {
                        if (r + cell.rowSpan > rIndex) cell.rowSpan += 1;
                        newOrigins.set(r + ',' + c, cell);
                    } else {
                        newOrigins.set((r + 1) + ',' + c, cell);
                    }
                }
                this.origins = newOrigins;
                this.rows += 1;
                this.rowStyle = this._shiftRowStyleForInsert(this.rowStyle, rIndex);
                if (values) {
                    for (let c = 0; c < this.cols; c++) this.origins.set(rIndex + ',' + c, { value: values[c] || '', rowSpan: 1, colSpan: 1, style: {} });
                }
                this._fillDefaults();
                this.clearSelections();
                this.render();
            }
            insertColumnAt(cIndex) {
                const newOrigins = new Map();
                for (const [key, cell] of this.origins) {
                    let [r, c] = key.split(',').map(Number);
                    if (c < cIndex) {
                        if (c + cell.colSpan > cIndex) cell.colSpan += 1;
                        newOrigins.set(r + ',' + c, cell);
                    } else {
                        newOrigins.set(r + ',' + (c + 1), cell);
                    }
                }
                this.origins = newOrigins;
                this.cols += 1;
                this._fillDefaults();
                this.clearSelections();
                this.render();
            }
            deleteRow(rIndex) { this._removeRow(rIndex); this.clearSelections(); this.render(); }
            deleteColumn(cIndex) { this._removeColumn(cIndex); this.clearSelections(); this.render(); }
            _removeRow(rIndex) {
                const newOrigins = new Map();
                for (const [key, cell] of this.origins) {
                    let [r, c] = key.split(',').map(Number);
                    if (r === rIndex && r + cell.rowSpan - 1 === rIndex) continue;
                    if (r <= rIndex && r + cell.rowSpan - 1 >= rIndex) cell.rowSpan -= 1;
                    if (r > rIndex) r -= 1;
                    newOrigins.set(r + ',' + c, cell);
                }
                this.origins = newOrigins;
                this.rows -= 1;
                this.rowStyle = this._shiftRowStyleForRemove(this.rowStyle, rIndex);
            }
            _removeColumn(cIndex) {
                const newOrigins = new Map();
                for (const [key, cell] of this.origins) {
                    let [r, c] = key.split(',').map(Number);
                    if (c === cIndex && c + cell.colSpan - 1 === cIndex) continue;
                    if (c <= cIndex && c + cell.colSpan - 1 >= cIndex) cell.colSpan -= 1;
                    if (c > cIndex) c -= 1;
                    newOrigins.set(r + ',' + c, cell);
                }
                this.origins = newOrigins;
                this.cols -= 1;
            }
            mergeSelected() {
                const sel = this.cellSelection;
                if (!sel) return;
                const r1 = Math.min(sel.r1, sel.r2), r2 = Math.max(sel.r1, sel.r2);
                const c1 = Math.min(sel.c1, sel.c2), c2 = Math.max(sel.c1, sel.c2);
                if (r1 === r2 && c1 === c2) return;
                let values = [];
                let firstStyle = {};
                const newOrigins = new Map();
                for (const [key, cell] of this.origins) {
                    const [r, c] = key.split(',').map(Number);
                    if (r >= r1 && r <= r2 && c >= c1 && c <= c2) {
                        if (cell.value) values.push(cell.value);
                        if (r === r1 && c === c1) firstStyle = cell.style || {};
                        continue;
                    }
                    newOrigins.set(key, cell);
                }
                newOrigins.set(r1 + ',' + c1, { value: values.join('，'), rowSpan: r2 - r1 + 1, colSpan: c2 - c1 + 1, style: firstStyle });
                this.origins = newOrigins;
                this.clearSelections(); this.render();
            }
            unmergeCell(r, c) {
                const key = r + ',' + c;
                const cell = this.origins.get(key);
                if (!cell || (cell.rowSpan === 1 && cell.colSpan === 1)) return;
                const val = cell.value;
                const style = cell.style || {};
                this.origins.delete(key);
                for (let i = 0; i < cell.rowSpan; i++)
                    for (let j = 0; j < cell.colSpan; j++)
                        this.origins.set((r + i) + ',' + (c + j), { value: (i === 0 && j === 0) ? val : '', rowSpan: 1, colSpan: 1, style: (i === 0 && j === 0) ? style : {} });
                this.render();
            }
            clearSelections() {
                this.cellSelection = null; this.anchor = null;
                this.onSelectionChange(this);
            }
            applyStyleToCell(r, c, style) {
                const cell = this.origins.get(r + ',' + c);
                if (cell) cell.style = Object.assign({}, style);
                this.render();
            }
            applyStyleToSelection(partial) {
                if (!this.cellSelection) return false;
                const { r1, c1, r2, c2 } = this.cellSelection;
                const rmin = Math.min(r1, r2), rmax = Math.max(r1, r2), cmin = Math.min(c1, c2), cmax = Math.max(c1, c2);
                for (const [key, cell] of this.origins) {
                    const [r, c] = key.split(',').map(Number);
                    if (r >= rmin && r <= rmax && c >= cmin && c <= cmax) {
                        cell.style = Object.assign({}, cell.style, partial);
                    }
                }
                this.render();
                return true;
            }
            clearStyleSelection() {
                if (!this.cellSelection) return false;
                const { r1, c1, r2, c2 } = this.cellSelection;
                const rmin = Math.min(r1, r2), rmax = Math.max(r1, r2), cmin = Math.min(c1, c2), cmax = Math.max(c1, c2);
                for (const [key, cell] of this.origins) {
                    const [r, c] = key.split(',').map(Number);
                    if (r >= rmin && r <= rmax && c >= cmin && c <= cmax) cell.style = {};
                }
                this.render();
                return true;
            }
            clearContentSelection() {
                if (!this.cellSelection) return false;
                const { r1, c1, r2, c2 } = this.cellSelection;
                const rmin = Math.min(r1, r2), rmax = Math.max(r1, r2), cmin = Math.min(c1, c2), cmax = Math.max(c1, c2);
                for (const [key, cell] of this.origins) {
                    const [r, c] = key.split(',').map(Number);
                    if (r >= rmin && r <= rmax && c >= cmin && c <= cmax) cell.value = '';
                }
                this.render();
                return true;
            }
            clearCellContent(r, c) {
                const cell = this.origins.get(r + ',' + c);
                if (cell) cell.value = '';
                this.render();
            }
            getAnchorStyle() {
                if (!this.anchor) return null;
                const cell = this.origins.get(this.anchor.r + ',' + this.anchor.c);
                return cell ? Object.assign({}, cell.style) : null;
            }
            _rowClass(r) {
                if (this.rowStyle[r]) return this.rowStyle[r];
                if (r < this.headerRows) return 'hdr';
                return (r - this.headerRows) % 2 === 0 ? 'datarow-even' : 'datarow-odd';
            }
            render() {
                const covered = this._coverage();
                let html = `<div class="table-scroll"><table data-grid="${this.id}"><colgroup>` +
                    Array.from({ length: this.cols }).map((_, idx) => (idx === 0 || idx === 1) ? '<col style="width:80px">' : '<col>').join('') + '</colgroup>';
                for (let r = 0; r < this.rows; r++) {
                    html += '<tr>';
                    for (let c = 0; c < this.cols; c++) {
                        if (covered[r][c]) continue;
                        const cell = this.origins.get(r + ',' + c);
                        if (!cell) continue;
                        const cls = [this._rowClass(r)];
                        if (this._inSelection(r, c)) cls.push('cellsel');
                        const isEditingThisCell = this.editingKey === r + ',' + c;
                        if (isEditingThisCell) cls.push('editing');
                        const attrs = [];
                        if (cell.rowSpan > 1) attrs.push(`rowspan="${cell.rowSpan}"`);
                        if (cell.colSpan > 1) attrs.push(`colspan="${cell.colSpan}"`);
                        const isHeaderCell = r < this.headerRows;
                        const styleAttr = styleToCss(cell.style);
                        html += `<td class="${cls.join(' ')}"${styleAttr} ${attrs.join(' ')} contenteditable="${isEditingThisCell}"
          data-r="${r}" data-c="${c}"
          onclick="window.__gridClickCell(event,'${this.id}',${r},${c})"
          ondblclick="window.__gridDblClick(event,'${this.id}',${r},${c})"
          onblur="window.__gridBlur(event,'${this.id}',${r},${c})"
          onkeydown="window.__gridKeydown(event,'${this.id}',${r},${c})"
          oninput="window.__gridEdit('${this.id}',${r},${c},this.innerText)"
          onmousedown="window.__gridMouseDown(event,'${this.id}',${r},${c})"
          onmouseenter="window.__gridMouseEnter(event,'${this.id}',${r},${c})"
          >${this._escape(cell.value)}${(isHeaderCell || isEditingThisCell) ? '' : '<span class="edit-hint">双击编辑</span>'}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</table></div>';
                this.container.innerHTML = html;
                if (this.editingKey) {
                    const [er, ec] = this.editingKey.split(',').map(Number);
                    const el = this.container.querySelector(`td[data-r="${er}"][data-c="${ec}"]`);
                    if (el) { el.focus(); placeCaretAtEnd(el); }
                }
                if (typeof schedulePersist === 'function') schedulePersist();
            }
            _inSelection(r, c) {
                if (!this.cellSelection) return false;
                const { r1, c1, r2, c2 } = this.cellSelection;
                const rmin = Math.min(r1, r2), rmax = Math.max(r1, r2), cmin = Math.min(c1, c2), cmax = Math.max(c1, c2);
                return r >= rmin && r <= rmax && c >= cmin && c <= cmax;
            }
            _escape(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            editCell(r, c, val) { const cell = this.origins.get(r + ',' + c); if (cell) cell.value = val; }
            clickCell(e, r, c) {
                if (this.editingKey === r + ',' + c) return; // already editing this cell, let caret move
                clearOtherSelections(this.id);
                setActiveTarget({ type: 'grid', id: this.id });
                if (e.shiftKey && this.anchor) {
                    this.cellSelection = { r1: this.anchor.r, c1: this.anchor.c, r2: r, c2: c };
                } else {
                    this.anchor = { r, c };
                    this.cellSelection = { r1: r, c1: c, r2: r, c2: c };
                }
                this.onSelectionChange(this);
                this.render();
            }
            startEdit(r, c) {
                if (this.editingKey && this.editingKey !== r + ',' + c) this.editingKey = null;
                clearOtherSelections(this.id);
                setActiveTarget({ type: 'grid', id: this.id });
                this.editingKey = r + ',' + c;
                this.cellSelection = { r1: r, c1: c, r2: r, c2: c };
                this.anchor = { r, c };
                this.render();
            }
            stopEdit(r, c, val) {
                if (this.editingKey !== r + ',' + c) return;
                this.editCell(r, c, val);
                this.editingKey = null;
                this.render();
            }
        }

        function placeCaretAtEnd(el) {
            el.focus();
            if (typeof window.getSelection !== 'undefined' && typeof document.createRange !== 'undefined') {
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        window.__gridEdit = (id, r, c, val) => { grids[id].editCell(r, c, val); };
        window.__gridClickCell = (e, id, r, c) => { grids[id].clickCell(e, r, c); };
        window.__gridDblClick = (e, id, r, c) => { e.preventDefault(); grids[id].startEdit(r, c); };
        window.__gridBlur = (e, id, r, c) => { grids[id].stopEdit(r, c, e.currentTarget.innerText); };
        window.__gridKeydown = (e, id, r, c) => {
            if (e.key === 'Enter' && e.altKey) {
                e.preventDefault();
                document.execCommand('insertLineBreak');
                return;
            }
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.currentTarget.blur(); }
            if (e.key === 'Escape') { e.currentTarget.blur(); }
        };

        /* ---------------- Drag-to-select (mouse) ---------------- */
        window.__dragState = { active: false, gridId: null, startR: null, startC: null };
        window.__gridMouseDown = (e, id, r, c) => {
            if (e.button !== 0) return; // left button only
            const g = grids[id];
            if (!g) return;
            if (g.editingKey === r + ',' + c) { window.__dragState.active = false; return; } // let native text selection work inside the cell being edited

            const anyEditing = Object.values(grids).some(gr => gr.editingKey !== null) || (typeof notice !== 'undefined' && notice.editingIdx !== null);

            if (anyEditing) {
                // 有格子正在编辑：不要依赖原生的 blur→click 流程（那样会因为整表重绘丢失点击目标，
                // 需要点两次才生效）。改为在 mousedown 这一步就把正在编辑的内容保存好、
                // 立刻切换选中到新点击的格子，一次点击直接完成。
                e.preventDefault();
                const activeEl = document.activeElement;
                const liveVal = (activeEl && activeEl.isContentEditable) ? activeEl.innerText : null;
                Object.values(grids).forEach(gr => {
                    if (gr.editingKey !== null) {
                        const [er, ec] = gr.editingKey.split(',').map(Number);
                        const val = (liveVal !== null) ? liveVal : (gr.origins.get(er + ',' + ec) || {}).value;
                        gr.editingKey = null;
                        gr.editCell(er, ec, val);
                    }
                });
                if (typeof notice !== 'undefined' && notice.editingIdx !== null) {
                    const idxEditing = notice.editingIdx;
                    const val = (liveVal !== null) ? liveVal : notice.lines[idxEditing];
                    notice.editingIdx = null;
                    notice.lines[idxEditing] = val;
                }
                Object.values(grids).forEach(gr => gr.render());
                if (typeof notice !== 'undefined') notice.render();

                g.clickCell(e, r, c);
                window.__dragState = { active: true, gridId: id, startR: r, startC: c };
                return;
            }

            e.preventDefault(); // avoid native text-drag-select while cell-dragging
            window.__dragState = { active: true, gridId: id, startR: r, startC: c };
        };
        window.__gridMouseEnter = (e, id, r, c) => {
            const ds = window.__dragState;
            if (!ds || !ds.active || ds.gridId !== id) return;
            if (e.buttons !== 1) { ds.active = false; return; } // button released outside the element
            const g = grids[id];
            if (!g || g.editingKey !== null) return;
            if (ds.startR === r && ds.startC === c) return; // no-op, single cell already selected on mousedown-equivalent
            clearOtherSelections(id);
            setActiveTarget({ type: 'grid', id });
            g.anchor = { r: ds.startR, c: ds.startC };
            g.cellSelection = { r1: ds.startR, c1: ds.startC, r2: r, c2: c };
            g.onSelectionChange(g);
            g.render();
        };
        document.addEventListener('mouseup', () => { if (window.__dragState) window.__dragState.active = false; });

        const grids = {};
        const boardMeta = {};
        const boardOrder = [];
        let moduleSeq = 0;
        function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        /* ---------------- Copy / paste for grid cells ---------------- */
        window.__internalClipboard = '';
        function copyGridSelection(g) {
            if (!g || !g.cellSelection) return;
            const { r1, c1, r2, c2 } = g.cellSelection;
            const rmin = Math.min(r1, r2), rmax = Math.max(r1, r2), cmin = Math.min(c1, c2), cmax = Math.max(c1, c2);
            const rowsOut = [];
            for (let r = rmin; r <= rmax; r++) {
                const rowVals = [];
                for (let c = cmin; c <= cmax; c++) {
                    const cell = g.origins.get(r + ',' + c);
                    rowVals.push(cell ? cell.value : '');
                }
                rowsOut.push(rowVals.join('\t'));
            }
            const text = rowsOut.join('\n');
            window.__internalClipboard = text;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => { });
            }
        }
        async function pasteGridSelection(g) {
            if (!g || !g.cellSelection) return;
            let text = '';
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    text = await navigator.clipboard.readText();
                }
            } catch (err) { /* 权限不足或不可用，回退到内部剪贴板 */ }
            if (!text) text = window.__internalClipboard || '';
            if (!text) return;
            text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (text.endsWith('\n')) text = text.slice(0, -1);
            const rowsIn = text.split('\n').map(row => row.split('\t'));
            const sel = g.cellSelection;
            const rmin = Math.min(sel.r1, sel.r2), rmax = Math.max(sel.r1, sel.r2);
            const cmin = Math.min(sel.c1, sel.c2), cmax = Math.max(sel.c1, sel.c2);
            const srcRows = rowsIn.length;
            const srcCols = Math.max(...rowsIn.map(row => row.length));
            if (srcRows === 1 && srcCols === 1) {
                const val = rowsIn[0][0] || '';
                for (let r = rmin; r <= rmax; r++) {
                    for (let c = cmin; c <= cmax; c++) {
                        if (r < g.rows && c < g.cols) g.editCell(r, c, val);
                    }
                }
            } else {
                for (let i = 0; i < srcRows; i++) {
                    const r = rmin + i;
                    if (r >= g.rows) break;
                    for (let j = 0; j < srcCols; j++) {
                        const c = cmin + j;
                        if (c >= g.cols) break;
                        g.editCell(r, c, rowsIn[i][j] !== undefined ? rowsIn[i][j] : '');
                    }
                }
            }
            g.render();
        }
        document.addEventListener('keydown', function (e) {
            const key = e.key ? e.key.toLowerCase() : '';
            if (!(e.ctrlKey || e.metaKey)) return;
            if (key !== 'c' && key !== 'v') return;
            const active = document.activeElement;
            const inEditable = active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
            if (inEditable) return;
            if ((typeof batchDialog !== 'undefined' && batchDialog.open) || (typeof appModal !== 'undefined' && appModal.open)) return;
            if (!window.activeTarget || window.activeTarget.type !== 'grid') return;
            const g = grids[window.activeTarget.id];
            if (!g || !g.cellSelection) return;
            e.preventDefault();
            if (key === 'c') copyGridSelection(g);
            else pasteGridSelection(g);
        });

        /* ---------------- Tab 切换单元格（选中或编辑状态均可用） ---------------- */
        function getAdjacentCell(g, r, c, dir) {
            const keys = Array.from(g.origins.keys()).map(k => k.split(',').map(Number));
            keys.sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]));
            const idx = keys.findIndex(([kr, kc]) => kr === r && kc === c);
            if (idx === -1) return null;
            let nidx = idx + dir;
            if (nidx < 0) nidx = keys.length - 1;      // Shift+Tab 在第一格时循环到最后一格
            if (nidx >= keys.length) nidx = 0;          // Tab 在最后一格时循环回第一格
            return keys[nidx];
        }
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Tab') return;
            if ((typeof batchDialog !== 'undefined' && batchDialog.open) || (typeof appModal !== 'undefined' && appModal.open)) return;
            if (!window.activeTarget || window.activeTarget.type !== 'grid') return;
            const g = grids[window.activeTarget.id];
            if (!g || !g.cellSelection) return;
            const { r1, c1, r2, c2 } = g.cellSelection;
            if (r1 !== r2 || c1 !== c2) return; // 多格选中时不处理，避免和合并等操作冲突

            e.preventDefault();

            // 如果当前正在编辑这个格子，先把已输入内容存下来
            const active = document.activeElement;
            if (g.editingKey === r1 + ',' + c1 && active && active.isContentEditable) {
                g.editCell(r1, c1, active.innerText);
            }

            const next = getAdjacentCell(g, r1, c1, e.shiftKey ? -1 : 1);
            if (next) g.startEdit(next[0], next[1]);
        });

        /* ---------------- Unified modal (alert / confirm / form) ---------------- */
        const appModal = document.getElementById('appModal');
        const appModalTitle = document.getElementById('appModalTitle');
        const appModalBody = document.getElementById('appModalBody');
        const appModalFoot = document.getElementById('appModalFoot');
        function closeAppModal(result) {
            if (appModal.__resolve) {
                const resolve = appModal.__resolve;
                appModal.__resolve = null;
                resolve(result);
            }
            if (appModal.open) appModal.close();
        }
        appModal.addEventListener('close', () => closeAppModal(null));
        function showAlert(message, title) {
            return new Promise(resolve => {
                appModal.__resolve = resolve;
                appModalTitle.textContent = title || '提示';
                appModalBody.innerHTML = `<div class="modal-msg">${escapeHtml(message)}</div>`;
                appModalFoot.innerHTML = `<button class="primary" id="modalOkBtn">好的</button>`;
                appModal.showModal();
                const okBtn = document.getElementById('modalOkBtn');
                okBtn.onclick = () => closeAppModal(true);
                okBtn.focus();
            });
        }
        function showConfirm(message, opts) {
            opts = opts || {};
            return new Promise(resolve => {
                appModal.__resolve = resolve;
                appModalTitle.textContent = opts.title || '请确认';
                appModalBody.innerHTML = `<div class="modal-msg">${escapeHtml(message)}</div>`;
                appModalFoot.innerHTML = `<button id="modalCancelBtn">${escapeHtml(opts.cancelText || '取消')}</button>` +
                    `<button class="${opts.danger ? 'danger' : 'primary'}" id="modalOkBtn">${escapeHtml(opts.okText || '确定')}</button>`;
                appModal.showModal();
                document.getElementById('modalCancelBtn').onclick = () => closeAppModal(false);
                const okBtn = document.getElementById('modalOkBtn');
                okBtn.onclick = () => closeAppModal(true);
                okBtn.focus();
            });
        }
        function showFormDialog(title, fields) {
            return new Promise(resolve => {
                appModal.__resolve = resolve;
                appModalTitle.textContent = title;
                appModalBody.innerHTML = fields.map((f, i) => `
          <div class="field">
            <label class="flabel">${escapeHtml(f.label)}</label>
            <input type="text" id="modalField${i}" value="${escapeHtml(f.value || '')}" placeholder="${escapeHtml(f.placeholder || '')}">
          </div>
        `).join('');
                appModalFoot.innerHTML = `<button id="modalCancelBtn">取消</button><button class="primary" id="modalOkBtn">确定</button>`;
                appModal.showModal();
                const collect = () => {
                    const result = {};
                    fields.forEach((f, i) => { result[f.key] = document.getElementById('modalField' + i).value; });
                    return result;
                };
                document.getElementById('modalCancelBtn').onclick = () => closeAppModal(null);
                document.getElementById('modalOkBtn').onclick = () => closeAppModal(collect());
                const inputs = appModalBody.querySelectorAll('input');
                inputs.forEach(inp => {
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter') { e.preventDefault(); closeAppModal(collect()); }
                    });
                });
                if (inputs[0]) { inputs[0].focus(); inputs[0].select(); }
            });
        }

        function startEditBoardMeta(e, id, field) {
            e.preventDefault();
            const el = e.currentTarget;
            el.setAttribute('contenteditable', 'true');
            el.focus();
            placeCaretAtEnd(el);
        }
        function stopEditBoardMeta(e, id, field, val) {
            const el = e.currentTarget;
            if (el.getAttribute('contenteditable') !== 'true') return;
            el.setAttribute('contenteditable', 'false');
            const text = (val != null ? val : el.innerText).trim();
            if (!boardMeta[id]) boardMeta[id] = {};
            boardMeta[id][field] = text;
            el.innerText = text;
            if (typeof schedulePersist === 'function') schedulePersist();
        }
        function boardMetaKeydown(e, id, field) {
            if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
            if (e.key === 'Escape') {
                e.currentTarget.innerText = (boardMeta[id] && boardMeta[id][field]) || '';
                e.currentTarget.blur();
            }
        }

        function clearOtherSelections(exceptGridId) {
            Object.keys(grids).forEach(id => {
                if (id !== exceptGridId && grids[id].cellSelection) {
                    grids[id].cellSelection = null;
                    grids[id].anchor = null;
                    grids[id].onSelectionChange(grids[id]);
                    grids[id].render();
                }
            });
            if (exceptGridId !== 'notice' && typeof notice !== 'undefined' && notice.selected.size) {
                notice.selected.clear();
                notice.render();
            }
        }

        function clearAllSelections() {
            Object.values(grids).forEach(g => {
                if (g.cellSelection) {
                    g.cellSelection = null;
                    g.anchor = null;
                    g.onSelectionChange(g);
                    g.render();
                }
            });
            if (typeof notice !== 'undefined' && notice.selected.size) {
                notice.selected.clear();
                notice.render();
            }
        }

        function updateStatusPill(g) {
            const wrap = document.querySelector(`[data-grid-id="${g.id}"] .status-pill`);
            if (!wrap) return;
            if (g.cellSelection && !(g.cellSelection.r1 === g.cellSelection.r2 && g.cellSelection.c1 === g.cellSelection.c2)) {
                const r1 = Math.min(g.cellSelection.r1, g.cellSelection.r2), r2 = Math.max(g.cellSelection.r1, g.cellSelection.r2);
                const c1 = Math.min(g.cellSelection.c1, g.cellSelection.c2), c2 = Math.max(g.cellSelection.c1, g.cellSelection.c2);
                wrap.textContent = `已选中 ${(r2 - r1 + 1) * (c2 - c1 + 1)} 格 · 右键可合并`;
                wrap.classList.add('active');
            } else {
                wrap.textContent = '右键操作 · 双击编辑 · 拖动/按shift多选 · 按ESC退出选中';
                wrap.classList.remove('active');
            }
        }

        function buildBoard(id, theme, title, codeText, rows3, reviewNames) {
            const wrap = document.createElement('div');
            wrap.className = 'board' + (theme === 'blue' ? ' blue' : '');
            wrap.dataset.gridId = id;
            wrap.innerHTML = `
        <div class="board-head">
          <div class="title">
            <span class="title-text" contenteditable="false"
              ondblclick="startEditBoardMeta(event,'${id}','title')"
              onblur="stopEditBoardMeta(event,'${id}','title',this.innerText)"
              onkeydown="boardMetaKeydown(event,'${id}','title')">${escapeHtml(title)}</span><span class="code" contenteditable="false"
              ondblclick="startEditBoardMeta(event,'${id}','code')"
              onblur="stopEditBoardMeta(event,'${id}','code',this.innerText)"
              onkeydown="boardMetaKeydown(event,'${id}','code')">${escapeHtml(codeText)}</span>
          </div>
          <div class="status-pill">右键操作 · 双击编辑</div>
        </div>
      
        <div id="${id}"></div>`;
            boardMeta[id] = { title, code: codeText, theme: (theme === 'blue' ? 'blue' : 'teal') };
            if (!boardOrder.includes(id)) boardOrder.push(id);
            document.getElementById('boards').appendChild(wrap);

            const cells = [
                { r: 0, c: 0, v: '岗位' },
                { r: 0, c: 1, v: '姓名' },
                { r: 0, c: 2, v: '主看/NV chính' },
                { r: 0, c: 3, v: '备/NV phụ' },
            ];
            rows3.forEach((row, i) => {
                cells.push({ r: 1 + i, c: 0, v: row[0] });
                cells.push({ r: 1 + i, c: 1, v: row[1] });
                cells.push({ r: 1 + i, c: 2, v: row[2] });
                cells.push({ r: 1 + i, c: 3, v: row[3] });
            });
            const reviewRowIndex = 1 + rows3.length;
            cells.push({ r: reviewRowIndex, c: 0, v: '审查' });
            cells.push({ r: reviewRowIndex, c: 1, v: reviewNames, rs: 1, cs: 3 });

            const g = new TableGrid(id, {
                rows: reviewRowIndex + 1, cols: 4, headerRows: 1, cells,
                rowStyle: { [reviewRowIndex]: 'reviewrow' },
                onSelectionChange: updateStatusPill
            });
            grids[id] = g;
        }

        async function addNewModule() {

                { key: 'code', label: '代号（可选）', value: '', placeholder: '如：25S-05X-D16' },
            ]);

            const title = (result.title || '').trim() || '新模块';
            const code = (result.code || '').trim();
            moduleSeq++;
            const id = 'boardCustom_' + Date.now() + '_' + moduleSeq;
            const theme = (boardOrder.length % 2 === 0) ? 'teal' : 'blue';
            buildBoard(id, theme, title, code, [['出款', '', '', '']], '');
            setActiveTarget({ type: 'grid', id });
            if (typeof schedulePersist === 'function') schedulePersist();
        }

            ],

            selected: new Set(),

            render() {

                el.innerHTML = this.lines.map((t, i) => `
      <div class="notice-line ${this.selected.has(i) ? 'selected' : ''}" data-idx="${i}" onclick="notice.rowClick(event, ${i})">
        <div class="txt" contenteditable="${this.editingIdx === i}"${styleToCss(this.styles[i])}
             ondblclick="notice.startEdit(event, ${i})"
             onblur="notice.stopEdit(${i}, this.innerText)"
             onkeydown="notice.keydown(event, ${i})"
             oninput="notice.edit(${i}, this.innerText)">${t.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div>
      </div>
    `).join('');
                const pill = document.getElementById('noticeStatus');
                if (this.selected.size) { pill.textContent = `已选中 ${this.selected.size} 条`; pill.classList.add('active'); }
                else { pill.textContent = '右键新增/删除'; pill.classList.remove('active'); }
                if (this.editingIdx !== null) {
                    const txt = el.querySelector(`.notice-line[data-idx="${this.editingIdx}"] .txt`);
                    if (txt) placeCaretAtEnd(txt);
                }
                if (typeof schedulePersist === 'function') schedulePersist();
            },
            rowClick(e, i) {
                if (e.target.classList.contains('txt') && this.editingIdx === i) return;
                clearOtherSelections('notice');
                setActiveTarget({ type: 'notice' });
                if (this.selected.has(i)) this.selected.delete(i); else this.selected.add(i);
                this.render();
            },
            startEdit(e, i) { e.stopPropagation(); setActiveTarget({ type: 'notice' }); this.editingIdx = i; this.render(); },
            stopEdit(i, val) { if (this.editingIdx !== i) return; this.lines[i] = val; this.editingIdx = null; this.render(); },
            keydown(e, i) {
                if (e.key === 'Enter' && e.altKey) {
                    e.preventDefault();
                    document.execCommand('insertLineBreak');
                    return;
                }
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.currentTarget.blur(); }
                if (e.key === 'Escape') e.currentTarget.blur();
            },
            edit(i, val) { this.lines[i] = val; },
            addLine(text = '') { this.lines.push(text); this.styles.push({}); this.render(); },
            insertLineAt(idx, text = '') { this.lines.splice(idx, 0, text); this.styles.splice(idx, 0, {}); this.selected.clear(); this.render(); },
            deleteLine(idx) { this.lines.splice(idx, 1); this.styles.splice(idx, 1); this.selected.clear(); this.render(); },
            deleteSelected() {
                if (this.selected.size === 0) return;
                const keepLines = [], keepStyles = [];
                this.lines.forEach((l, i) => {
                    if (!this.selected.has(i)) { keepLines.push(l); keepStyles.push(this.styles[i] || {}); }
                });
                this.lines = keepLines; this.styles = keepStyles;
                this.selected.clear(); this.render();
            },
            applyStyleSelected(partial) {
                if (this.selected.size === 0) return false;
                this.selected.forEach(i => { this.styles[i] = Object.assign({}, this.styles[i] || {}, partial); });
                this.render();
                return true;
            },
            clearStyleSelected() {
                if (this.selected.size === 0) return false;
                this.selected.forEach(i => { this.styles[i] = {}; });
                this.render();
                return true;

        /* ---------------- Toolbar (top bar) ---------------- */
        function setActiveTarget(t) {
            window.activeTarget = t;

            if (t && t.type === 'grid') el.textContent = '当前：' + ((boardMeta[t.id] && boardMeta[t.id].title) || t.id);
            else if (t && t.type === 'notice') el.textContent = '当前：共同注意事项';
            else el.textContent = '未选择';
        }

        function clearCellOrSelectionContent(gridId, r, c) {
            const g = grids[gridId];
            if (!g) return;
            const sel = g.cellSelection;
            if (sel) {
                const rmin = Math.min(sel.r1, sel.r2), rmax = Math.max(sel.r1, sel.r2);
                const cmin = Math.min(sel.c1, sel.c2), cmax = Math.max(sel.c1, sel.c2);
                if (r >= rmin && r <= rmax && c >= cmin && c <= cmax) { g.clearContentSelection(); return; }
            }
            g.clearCellContent(r, c);
        }
        function toolbarAction(kind) {
            if (!window.activeTarget || window.activeTarget.type !== 'grid') { showAlert('请先在表格中点击选中一个单元格'); return; }
            const g = grids[window.activeTarget.id];
            const sel = g.cellSelection;
            switch (kind) {
                case 'addRowEnd': g.addRow(); break;
                case 'addColEnd': g.addColumn(); break;
                case 'insertRowAbove': if (!sel) { showAlert('请先选中单元格'); return; } g.insertRowAt(Math.min(sel.r1, sel.r2)); break;
                case 'insertRowBelow': if (!sel) { showAlert('请先选中单元格'); return; } g.insertRowAt(Math.max(sel.r1, sel.r2) + 1); break;
                case 'deleteRow': if (!sel) { showAlert('请先选中单元格'); return; } g.deleteRow(Math.min(sel.r1, sel.r2)); break;
                case 'insertColLeft': if (!sel) { showAlert('请先选中单元格'); return; } g.insertColumnAt(Math.min(sel.c1, sel.c2)); break;
                case 'insertColRight': if (!sel) { showAlert('请先选中单元格'); return; } g.insertColumnAt(Math.max(sel.c1, sel.c2) + 1); break;
                case 'deleteCol': if (!sel) { showAlert('请先选中单元格'); return; } g.deleteColumn(Math.min(sel.c1, sel.c2)); break;
                case 'merge': if (!sel || (sel.r1 === sel.r2 && sel.c1 === sel.c2)) { showAlert('请先拖动鼠标或按住 Shift 点击选中多个单元格'); return; } g.mergeSelected(); break;
                case 'unmerge': if (!sel) { showAlert('请先选中单元格'); return; } g.unmergeCell(Math.min(sel.r1, sel.r2), Math.min(sel.c1, sel.c2)); break;
                case 'clearContent': if (!g.clearContentSelection()) showAlert('请先选中单元格'); break;
                case 'batchAdd': openBatchFor(g.id); break;
                case 'addEmployee': quickAddEmployee(g.id); break;
                case 'copyCells': if (!sel) { showAlert('请先选中单元格'); return; } copyGridSelection(g); break;
                case 'pasteCells': if (!sel) { showAlert('请先选中单元格'); return; } pasteGridSelection(g); break;
            }
        }
